[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run on release, not during the build — the build has no access to
# the real database.
#
# Run from /migrator, which carries the Prisma CLI's full dependency tree. The
# app's own runtime is the slim Next standalone bundle and has no prisma CLI.
preDeployCommand = "node /migrator/node_modules/prisma/build/index.js migrate deploy --schema=/migrator/prisma/schema.prisma"
startCommand = "node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
